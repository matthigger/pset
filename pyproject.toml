[project]
name = "solrub"
version = "0.3.1"
description = "Build the student, solution and rubric PDFs of a LaTeX assignment."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "higger", email = "matt.higger@gmail.com" }]
keywords = ["latex", "pdflatex", "teaching", "exam", "rubric", "grading"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

dependencies = ["tomli>=2.0 ; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/matthigger/solrub"
Documentation = "https://github.com/matthigger/solrub/blob/main/docs/points.md"
Issues = "https://github.com/matthigger/solrub/issues"

[project.optional-dependencies]
pts = ["sum-pts>=0.0.4"]

[project.scripts]
solrub = "solrub:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["solrub"]

[project]
name = "pset"
version = "0.5.0"
description = "Build assignments from a repo of LaTeX problems, each carrying its own solution and rubric."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "higger", email = "matt.higger@gmail.com" }]
keywords = ["latex", "pdflatex", "teaching", "exam", "rubric", "grading",
            "problem-bank"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

dependencies = ["tomli>=2.0 ; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/matthigger/pset"
Documentation = "https://github.com/matthigger/pset/blob/main/docs/points.md"
Issues = "https://github.com/matthigger/pset/issues"

[project.optional-dependencies]
pts = ["sum-pts>=0.0.4"]

[project.scripts]
pset = "pset:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pset"]

[tool.setuptools.package-data]
# The browse template, README_pset.md and the whole example repo, all
# read back out at runtime through importlib.resources.
pset = ["data/*.tex", "data/*.md", "data/example/**/*"]
